# AI CRM Voice Assistant - 统一配置文件
# 配置说明：所有模块共享此配置文件
# 支持多种厂商的 LLM、ASR、TTS 服务配置

# ==================== LLM 配置 ====================
# 支持的类型：openai（兼容阿里云通义千问）、baidu（百度文心一言）、tencent（腾讯混元）、doubao（字节豆包）
llm:
  type: openai  # 当前使用的 LLM 类型
  # ========== OpenAI 兼容配置（阿里云通义千问等） ==========
  openai:
    api_key: sk-dbdcd9e2b2b845a79c4a89b8da9cbdcd
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-max
    temperature: 0.7
    max_tokens: 2000
  # ========== 百度文心一言配置 ==========
  baidu:
    api_key: ""  # 百度 API Key
    secret_key: ""  # 百度 Secret Key
    model: ernie-3.5-turbo
    temperature: 0.7
    max_tokens: 2000
  # ========== 腾讯混元配置 ==========
  tencent:
    secret_id: ""  # 腾讯云 Secret ID
    secret_key: ""  # 腾讯云 Secret Key
    model: hunyuan
    temperature: 0.7
    max_tokens: 2000
  # ========== 字节豆包配置 ==========
  doubao:
    api_key: ""  # 字节 API Key
    secret_key: ""  # 字节 Secret Key
    model: doubao
    temperature: 0.7
    max_tokens: 2000

# ==================== AI CRM 配置 ====================
crm:
  TavilySearchResults_API_KEY: "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"
  # RAG 知识库路径
  vector_db_path: "AI CRM/storage/vector_db"
  upload_folder: "AI CRM/uploads"

# ==================== MySQL 数据库配置 ====================
database:
  host: "localhost"
  port: 3306
  user: "root"
  password: "123456"
  db: "AI_CRM"

# ==================== TTS 配置 ====================
# 支持的类型：edge（EdgeTTS）、aliyun（阿里云）、baidu（百度）、tencent（腾讯）、doubao（字节豆包）、openai（OpenAI）
tts:
  type: edge  # 当前使用的 TTS 类型
  output_dir: "tmp/"
  format: wav
  sample_rate: 16000
  # ========== EdgeTTS 配置（免费） ==========
  edge:
    voice: "zh-CN-XiaoxiaoNeural"  # 可选: zh-CN-XiaoxiaoNeural, zh-CN-YunxiNeural, zh-CN-YunyangNeural, zh-CN-XiaoyiNeural
  # ========== 阿里云 TTS 配置 ==========
  aliyun:
    access_key_id: ""  # 阿里云 AccessKey ID
    access_key_secret: ""  # 阿里云 AccessKey Secret
    appkey: ""  # 阿里云 AppKey
    voice: "xiaoyun"  # 可选: xiaoyun, xiaoshuang, xiaoqing, xiaoqiang, xiaoni, xiaomei, xiaorong
    volume: 50
    speech_rate: 0
    pitch_rate: 0
  # ========== 百度 TTS 配置 ==========
  baidu:
    app_id: ""  # 百度 App ID
    api_key: ""  # 百度 API Key
    secret_key: ""  # 百度 Secret Key
    voice: 1537  # 普通话女声
    speed: 5
    volume: 5
    pitch: 5
  # ========== 腾讯 TTS 配置 ==========
  tencent:
    appid: ""  # 腾讯 AppID
    secret_id: ""  # 腾讯云 Secret ID
    secret_key: ""  # 腾讯云 Secret Key
    voice: 1001  # 音色ID
    region: "ap-shanghai"
  # ========== 字节豆包 TTS 配置 ==========
  doubao:
    appid: ""  # 字节 AppID
    access_token: ""  # 字节 Access Token
    cluster: ""  # 集群地址
    voice: "zh_female"
    speed_ratio: 1.0
    volume_ratio: 1.0
    pitch_ratio: 1.0
  # ========== OpenAI TTS 配置 ==========
  openai:
    api_key: ""  # OpenAI API Key
    api_url: "https://api.openai.com/v1/audio/speech"
    model: "tts-1"
    voice: "alloy"  # 可选: alloy, echo, fable, onyx, nova, shimmer
    speed: 1.0

# ==================== ASR/STT 配置 ====================
# 支持的类型：sensevoice（本地模型）、funasr（本地模型）、aliyun（阿里云）、baidu（百度）、tencent（腾讯）、doubao（字节豆包）、openai（OpenAI）、qwen3（阿里云Qwen3-ASR-Flash）、vosk（本地模型）、sherpa（本地模型）
asr:
  type: sensevoice  # 当前使用的 ASR 类型
  output_dir: "tmp/"
  delete_audio_file: true
  # ========== SenseVoice 本地模型配置 ==========
  sensevoice:
    model_dir: "voice_qa_api/models/SenseVoiceSmall"
  # ========== FunASR 本地模型配置 ==========
  funasr:
    model_dir: "damo/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404"
  # ========== 阿里云 ASR 配置 ==========
  aliyun:
    access_key_id: ""  # 阿里云 AccessKey ID
    access_key_secret: ""  # 阿里云 AccessKey Secret
    appkey: ""  # 阿里云 AppKey
    sample_rate: 16000
    format: wav
  # ========== 百度 ASR 配置 ==========
  baidu:
    app_id: ""  # 百度 App ID
    api_key: ""  # 百度 API Key
    secret_key: ""  # 百度 Secret Key
    dev_pid: 1537  # 普通话识别
  # ========== 腾讯 ASR 配置 ==========
  tencent:
    secret_id: ""  # 腾讯云 Secret ID
    secret_key: ""  # 腾讯云 Secret Key
  # ========== 字节豆包 ASR 配置 ==========
  doubao:
    appid: ""  # 字节 AppID
    access_token: ""  # 字节 Access Token
    cluster: ""  # 集群地址
  # ========== OpenAI ASR 配置 ==========
  openai:
    api_key: ""  # OpenAI API Key
    api_url: "https://api.openai.com/v1/audio/transcriptions"
    model_name: "whisper-1"
  # ========== Qwen3-ASR-Flash 配置（阿里云） ==========
  qwen3:
    api_key: ""  # 阿里云 DashScope API Key
    model_name: "qwen3-asr-flash"
    enable_lid: true  # 自动语言检测
    enable_itn: true  # 文本规范化
    language: ""  # 空则自动检测，可选: zh, en, ja, ko
    context: ""  # 上下文提示
  # ========== Vosk 本地模型配置 ==========
  vosk:
    model_path: "vosk-model-small-cn-0.22"
  # ========== Sherpa ONNX 本地模型配置 ==========
  sherpa:
    model_dir: "sherpa-onnx-sense-voice-zh-en-ja-ko-yue"
    model_type: "sense_voice"

# ==================== 服务配置 ====================
server:
  http_port: 8000
  gradio_port: 7860

# ==================== 系统提示词 ====================
prompts:
  system: |
    你是一个专业的 AI CRM 智能助手 (SeaChat)。你的主要职责是协助用户进行日常对话、解答业务知识、查询实时信息以及管理客户数据。
    你可以使用 RAG 知识库、Tavily 搜索引擎和 MySQL 数据库来回答问题。
    注意：绝对禁止执行任何 DELETE、DROP 或 TRUNCATE 操作。